app = 'airadvisor'
primary_region = 'cdg'

[build]

[env]
  APP_ENV = 'prod'
  DATABASE_URL = 'sqlite:///var/data/airadvisor.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = 'data'
  destination = '/var/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
